<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Reasy — Configurações</title>
  <style>
    :root{
      --bg:#fff;
      --fg:#111;
      --muted:#666;
      --border:rgba(0,0,0,.08);
      --shadow:0 2px 10px rgba(0,0,0,0.3);
      --radius:10px;
      --brand:#111;
      --brand-contrast:#fff;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#121212;
        --fg:#eaeaea;
        --muted:#a0a0a0;
        --border:rgba(255,255,255,.12);
        --shadow:0 2px 16px rgba(0,0,0,.6);
        --brand:#eaeaea;
        --brand-contrast:#121212;
      }
    }

    html, body { margin:0; padding:0; }
    body {
      width: 340px;
      color: var(--fg);
      background: transparent;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif;
    }

    .card {
      background: var(--bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .header {
      position: sticky; top: 0;
      display:flex; align-items:center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 1;
    }
    .title { margin:0; font-size:16px; font-weight:700; }
    .spacer { flex:1 1 auto; }

    .close-btn {
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: background .15s ease;
    }
    .close-btn:hover { background: rgba(0,0,0,0.05); }
    .close-btn svg { width: 16px; height: 16px; fill: var(--fg); }

    .content {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    label { font-weight:600; font-size:13px; }
    select {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px 10px;
      background: transparent;
      color: var(--fg);
      outline: none;
    }
    select:focus { border-color: rgba(21,101,192,.6); box-shadow: 0 0 0 3px rgba(21,101,192,.15); }

    .hint { color: var(--muted); font-size:12px; }

    .actions { padding: 0 14px 14px; }
    .btn {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: var(--brand-contrast);
      font-weight: 600;
      cursor: pointer;
      transition: transform .04s ease, opacity .2s ease;
    }
    .btn:active { transform: translateY(1px); }
    .ok { color: #2e7d32; font-size:12px; margin-top:8px; display:none; }
    .err { color: #c62828; font-size:12px; margin-top:8px; display:none; }
    .row { display: grid; gap: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1 class="title">Configurações</h1>
      <div class="spacer"></div>
      <button class="close-btn" id="closePopup" title="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 512">
          <path d="M242.7 256l100.1-100.1c12.3-12.3 12.3-32.2 
          0-44.5l-22.2-22.2c-12.3-12.3-32.2-12.3-44.5 
          0L176 189.3 75.9 89.2c-12.3-12.3-32.2-12.3-44.5 
          0L9.2 111.5c-12.3 12.3-12.3 32.2 0 
          44.5L109.3 256 9.2 356.1c-12.3 12.3-12.3 
          32.2 0 44.5l22.2 22.2c12.3 12.3 32.2 12.3 
          44.5 0L176 322.7l100.1 100.1c12.3 
          12.3 32.2 12.3 44.5 0l22.2-22.2c12.3-12.3 
          12.3-32.2 0-44.5L242.7 256z"/>
        </svg>
      </button>
    </div>

    <div class="content">
      <div class="row">
        <label for="font">Fonte do Resumo</label>
        <select id="font">
          <option value="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, sans-serif">Inter/Sistema (padrão)</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Times New Roman, serif">Times New Roman</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="Georgia, serif">Georgia</option>
        </select>
      </div>

      <div class="row">
        <label for="color">Cor do Resumo</label>
        <select id="color">
          <option value="black">Preto</option>
          <option value="red">Vermelho</option>
          <option value="blue">Azul</option>
          <option value="green">Verde</option>
        </select>
      </div>

      <div class="row">
        <label for="style">Tipo do Resumo</label>
        <select id="style">
          <option value="texto">Apenas texto</option>
          <option value="topicos">Com tópicos</option>
          <option value="mesclado" selected>Mesclado</option>
        </select>
      </div>

      <div class="hint">As preferências ficam salvas neste navegador.</div>
    </div>

    <div class="actions">
      <button class="btn" id="saveBtn">Salvar</button>
      <div class="ok" id="okMsg">Preferências salvas!</div>
      <div class="err" id="errMsg">Erro ao salvar (veja o console do popup).</div>
    </div>
  </div>

  <script src="popup.js"></script>
  <script>
    document.getElementById("closePopup").addEventListener("click", () => {
      window.close();
    });
  </script>
</body>
</html>
